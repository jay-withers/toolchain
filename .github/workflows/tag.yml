name: tag

on:
  push:
    branches: [main]

jobs:
  # Bump the semver tag from the conventional commits since the last release
  # (and create a matching GitHub release) via the shared release template.
  tag:
    permissions:
      contents: write
    uses: jay-withers/workflows/.github/workflows/release.yml@255feb3a1a11cd2436bf44eaf7b058ea43a117c1 # v1.5.0
