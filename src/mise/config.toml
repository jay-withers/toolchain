# Global mise tools: what every jay-withers repo assumes is on PATH but no
# single repo owns. setup.sh links this file into
# ~/.config/mise/conf.d/toolchain.toml, so `git pull && mise install` in this
# clone is how the machine catches up. It never replaces your own
# ~/.config/mise/config.toml, which loads after it and wins.
#
# A repo's own mise.toml overrides any version here while you are inside it,
# and is what CI installs (jay-withers/workflows v1.26.0+), so pin anything a
# repo's build or lint depends on in that repo, not only here. Renovate's mise
# manager keeps these versions current, except gcloud (see below).

[tools]
# Azure
# On its own Python 3.14, not the global python below: on macOS azure-cli
# pulls in pymsalruntime, which publishes no wheel for a CPython newer than
# its release (none for 3.15 as of 2026-11). Raise it once pymsalruntime ships
# wheels for the global python.
"pypi:azure-cli" = { version = "2.93.0", python = "3.14" }
# The registry's "kubelogin" is int128/kubelogin, an unrelated OIDC helper.
"aqua:Azure/kubelogin" = "0.2.22"
powershell = "7.7.0"

# Google Cloud: gcloud, gsutil and bq, with the SDK's own bundled Python.
# Renovate's mise manager can't resolve the vfox backend mise's registry uses,
# so renovate.json tracks it through the google/cloud-sdk image's tags, which
# carry the same version.
gcloud = "594.0.1"

# AWS CLI v2. Named with its backend, like kubelogin, so Renovate's mise
# manager can resolve it.
"aqua:aws/aws-cli" = "2.42.3"

# GitHub
gh = "2.105.0"

# Terraform: a default for repos that pin none. Repos pin their own in
# mise.toml (or, until they move, .terraform-version: see [settings]).
terraform = "1.17.2"
tflint = "0.66.0"
terraform-docs = "0.25.1"
checkov = "3.4.5"

# Kubernetes
kubectl = "1.37.2"
helm = "4.3.2"
k9s = "0.51.0"
kubectx = "0.11.0"

# Claude Code CLI (`claude`), from mise's registry entry for it. The VS Code
# extension bundles its own; this is for terminals. Named with its backend,
# like kubelogin, so Renovate's mise manager can resolve it. Renovate bumps it,
# so [env] below turns off its self-updater.
"aqua:anthropics/claude-code" = "2.1.332"

# Languages and the hooks every repo runs
python = "3.15.2"
uv = "0.13.10"
node = "26.13.1"
pre-commit = "4.7.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
jq = "1.8.2"
yq = "4.54.3"

# Interactive shells, wired in by src/shell/rc.{bash,zsh}: the prompt
# (directory, git branch and status), Ctrl-R history search, `z` to jump to a
# directory, and `usage`, which `mise completion` needs
starship = "1.27.0"
atuin = "18.25.1"
zoxide = "0.10.0"
usage = "7.4.1"

[env]
# Set whenever a mise shim runs, so it covers every way claude starts
# (terminal, make, VS Code tasks), not only interactive shells: its updater
# would replace the version Renovate pins behind mise's back.
DISABLE_AUTOUPDATER = "1"

[settings]
# Read .terraform-version too, so repos that have not yet moved to mise.toml
# still get the Terraform they pin. Drop once every repo has mise.toml.
idiomatic_version_file_enable_tools = ["terraform"]
