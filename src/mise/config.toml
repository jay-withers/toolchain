# Global mise tools: what every jay-withers repo assumes is on PATH but no
# single repo owns. setup.sh links this file into
# ~/.config/mise/conf.d/toolchain.toml, so `git pull && mise install` in this
# clone is how the machine catches up. It never replaces your own
# ~/.config/mise/config.toml, which loads after it and wins.
#
# A repo's own mise.toml overrides any version here while you are inside it,
# and is what CI installs (jay-withers/workflows v1.26.0+), so pin anything a
# repo's build or lint depends on in that repo, not only here. Renovate's mise
# manager keeps these versions current.

[tools]
# Azure
"pypi:azure-cli" = "2.92.0"
# The registry's "kubelogin" is int128/kubelogin, an unrelated OIDC helper.
"aqua:Azure/kubelogin" = "0.2.22"
powershell = "7.6.9"

# GitHub
gh = "2.103.3"

# Terraform: a default for repos that pin none. Repos pin their own in
# mise.toml (or, until they move, .terraform-version: see [settings]).
terraform = "1.17.1"
tflint = "0.65.0"
terraform-docs = "0.24.0"
checkov = "3.3.20"

# Kubernetes
kubectl = "1.37.2"
helm = "4.3.1"
k9s = "0.51.0"
kubectx = "0.11.0"

# Languages and the hooks every repo runs
python = "3.14.10"
uv = "0.13.6"
node = "26.13.0"
pre-commit = "4.7.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
jq = "1.8.2"
yq = "4.54.3"

[settings]
# Read .terraform-version too, so repos that have not yet moved to mise.toml
# still get the Terraform they pin. Drop once every repo has mise.toml.
idiomatic_version_file_enable_tools = ["terraform"]
